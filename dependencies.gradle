repositories {
	mavenLocal()
	mavenCentral()
	maven {
		name "Modmaven"
		url "https://modmaven.dev"
		content {
			// Tesseract
			includeGroup "net.swedz"
			// JEI
			includeGroup "mezz.jei"
			// GrandPower
			includeGroup "dev.technici4n"
		}
	}
	maven {
		name = "Sleeping Town"
		url = "https://repo.sleeping.town/"
		content {
			// EMI
			includeGroup "dev.emi"
		}
	}
	maven {
		name "Sonatype"
		url = "https://central.sonatype.com/repository/maven-snapshots/"
		content {
			// GuideME
			includeGroup "org.appliedenergistics"
		}
	}
}

dependencies {
	implementation "net.swedz:tesseract-api-neoforge:${tesseract_version}"

	if (project.runtime_include_emi.toBoolean()) {
		localImplementation "dev.emi:emi-neoforge:${emi_version}:api"
	} else {
		compileOnly "dev.emi:emi-neoforge:${emi_version}:api"
	}
	runtimeOnly "dev.emi:emi-neoforge:${emi_version}"

	compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
	if(project.runtime_include_jei.toBoolean())
	{
		runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
	}

	localImplementation "org.appliedenergistics:guideme:${guideme_version}"

	compileOnly "dev.technici4n:GrandPower:${grandpower_version}"
}